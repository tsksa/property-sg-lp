name: Refresh condo price pages

# Regenerates /condo-prices/ from URA caveat data and opens a PR for review.
# Mirrors refresh-estate-pages.yml, including its hard-learned rules: never
# merge automatically, never open drafts, and never swallow gh failures.

on:
  schedule:
    - cron: "17 2 7 * *" # monthly, offset from the estate refresh
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Open the refresh PR. Untick to build only and download the pages as an artifact."
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Regenerate condo pages from URA
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
        run: node scripts/generate-condo-pages.mjs

      # JOE-448: the launch pages link the district pages, and
      # apply-page-furniture.mjs also refreshes the district link lists on
      # /neighbour-prices/ and /valuation.html. All are built from the page
      # directories, so the launch pages are regenerated (before the furniture,
      # which tidies their font block) and the lot is committed below: a district
      # that newly clears the caveat floor then ships in one PR.
      - name: Regenerate launch pages, re-apply shared page furniture and refresh metadata
        run: |
          node scripts/generate-new-launch-index.mjs
          node scripts/generate-project-pages.mjs
          node scripts/apply-page-furniture.mjs
          node scripts/refresh-sitemap-lastmod.mjs
          node scripts/generate-llms-txt.mjs

      - name: Consistency guard
        run: node scripts/check-consistency.mjs

      # Build-only runs (open_pr unticked) hand the regenerated pages back as an
      # artifact, so a branch that changes the page template can be previewed
      # with real URA data without a key on the developer's machine.
      - name: Upload regenerated pages (build-only run)
        if: github.event_name == 'workflow_dispatch' && !inputs.open_pr
        uses: actions/upload-artifact@v7
        with:
          name: condo-pages
          path: |
            condo-prices/
            sitemap.xml
            llms.txt
          retention-days: 3

      - name: Open PR
        if: github.event_name != 'workflow_dispatch' || inputs.open_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then echo "No data changes this month."; exit 0; fi
          BRANCH="auto/condo-refresh-$(date -u +%Y-%m)"
          git config user.name "condo-refresh-bot"
          git config user.email "actions@github.com"
          git checkout -B "$BRANCH"
          # Besides the data pages, the pages that link them (see the furniture
          # step); those only change when a district page is added.
          git add condo-prices/ sitemap.xml llms.txt \
            index.html valuation.html neighbour-prices/index.html calculator/index.html \
            insights/index.html insights/hdb-valuation-explained.html insights/how-long-to-sell-hdb-singapore-2026.html \
            new-launches/*.html
          git commit -m "Monthly condo-page refresh from URA ($(date -u +%Y-%m))"
          git push -f origin "$BRANCH"
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #${existing} already open for ${BRANCH} — updated by the force-push above."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "Monthly condo-page data refresh ($(date -u +%Y-%m))" \
            --body "Automated regeneration of /condo-prices/ from URA caveat data. Consistency guard passed in this workflow. Review the diff (medians + recent-transactions tables) and merge."
