name: Refresh estate market pages

# The HDB resale dataset updates monthly. Regenerate /hdb-prices/ from it and
# open a PR with the diff — Joe reviews and merges (pages never change silently).

on:
  schedule:
    - cron: "43 2 3 * *" # 3rd of each month, 02:43 UTC (off the :00 stampede)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # refresh-sitemap-lastmod reads git history; a shallow clone reports the
          # clone date for every file and would flag the whole sitemap as stale.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate pages from data.gov.sg
        run: node scripts/generate-estate-pages.mjs

      - name: Consistency guard on the result
        run: node scripts/check-consistency.mjs

      - name: Refresh sitemap lastmod for the regenerated pages
        run: node scripts/refresh-sitemap-lastmod.mjs

      - name: Open refresh PR if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "No data changes this month."; exit 0; fi
          BRANCH="auto/estate-refresh-$(date -u +%Y-%m)"
          git config user.name "estate-refresh-bot"
          git config user.email "actions@github.com"
          git checkout -B "$BRANCH"
          git add hdb-prices/ sitemap.xml
          git commit -m "Monthly estate-page refresh from data.gov.sg ($(date -u +%Y-%m))"
          git push -f origin "$BRANCH"

          # `gh pr create ... || echo` used to swallow every failure, not just the
          # already-exists case. It failed silently on 2026-08-03 and the refresh sat
          # on an orphan branch for 11 days with nothing pointing at it. Check for an
          # existing PR explicitly, and let a real failure fail the run.
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #${existing} already open for ${BRANCH} — updated by the force-push above."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "Monthly estate-page data refresh ($(date -u +%Y-%m))" \
            --body "Automated regeneration of /hdb-prices/ from the HDB Resale Flat Prices dataset. Consistency guard passed in this workflow. Review the diff (medians + recent-sales tables) and merge."
