# Netlify build & deploy config
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."
  functions = "netlify/functions"

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # HSTS — force HTTPS for two years, include all subdomains, preload-eligible.
    # Safe because joetay.com is HTTPS-only on Netlify and has no HTTP subdomains.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Isolate the browsing context from other-origin tabs (tabnabbing defence
    # complementing the per-link rel="noopener" from PR #50).
    # "allow-popups" lets the WhatsApp / Calendly / external links keep opening
    # in new tabs; only cross-origin window.opener is blocked.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Report-only CSP (ARCHITECTURE.md "parked" proposal, promoted to shipped).
    # Enumerated from every external host the site actually loads (fonts,
    # GA4, Meta Pixel, reCAPTCHA, Calendly, data.gov.sg/OneMap, the Matterport/
    # Tubear/Synology-NAS virtual tours, unpkg for /autopilot/). Report-only —
    # nothing is blocked yet, so this ships with zero breakage risk. It still
    # earns its keep today: it's the one directive class report-only can't
    # relax — 'unsafe-inline' covers this build-less site's many inline
    # <script>/onclick= blocks, but an attacker-injected <script src="evil.tld">
    # is not in any allow-listed origin below and would still be reported.
    # A future enforcing pass needs a report-to endpoint and a burn-in period
    # to confirm no allow-listed origin was missed.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://www.google.com https://www.gstatic.com https://assets.calendly.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.calendly.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://data.gov.sg https://www.onemap.gov.sg https://www.google.com; frame-src https://calendly.com https://my.matterport.com https://tubear.co https://*.synology.me https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Match the .jpg/.png pattern — hero preloads target webp variants so this
# is the highest-leverage cache rule on the site.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Friendly alias so the form can POST to /api/submit-lead as well
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA-style fallback not needed — this is a multi-page static site

# Monthly price-alert digest — matches subscriptions against the latest
# HDB dataset month and emails Joe one follow-up list (see alert-digest.js).
[functions."alert-digest"]
  schedule = "37 1 6 * *"
